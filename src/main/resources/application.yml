spring:
  application:
    name: memory-mcp
  main:
    banner-mode: off
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/memorymcp}
    username: ${SPRING_DATASOURCE_USERNAME:memorymcp}
    password: ${SPRING_DATASOURCE_PASSWORD:memorymcp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    mcp:
      server:
        name: memory-mcp
        version: 0.1.0
        stdio: false

---
spring:
  config:
    activate:
      on-profile: mcp-stdio
  main:
    web-application-type: none
  ai:
    mcp:
      server:
        stdio: true
