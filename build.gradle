plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.iuribabalin'
version = '0.0.1-SNAPSHOT'
description = 'MCP server providing Postgres-backed long-term memory for Claude Code'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = 'memory-mcp.jar'
}

// ---- Vue dashboard (ui/) ----
// Vite writes to build/ui-dist; processResources packages it as /static inside the boot jar.
// Pass -PskipUi when the bundle was built elsewhere (see the ui stage in the Dockerfile).

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def uiDir = layout.projectDirectory.dir('ui')
def uiDist = layout.buildDirectory.dir('ui-dist')
def skipUi = providers.gradleProperty('skipUi').present

/**
 * Finds npm without relying on the PATH alone: Gradle daemons started by an IDE inherit the
 * desktop session's environment, which usually misses nvm/fnm/volta shims set up in the shell.
 * Override with -PnpmExecutable=/path/to/npm if the search misses your install.
 */
def findNpm = {
    def names = isWindows ? ['npm.cmd', 'npm.exe'] : ['npm']

    def override = providers.gradleProperty('npmExecutable').orNull ?: System.getenv('MEMORY_MCP_NPM')
    if (override) {
        return new File(override)
    }

    def home = new File(System.getProperty('user.home'))
    def dirs = []
    (System.getenv('PATH') ?: '').split(File.pathSeparator).findAll { it }.each { dirs << new File(it) }

    def versionDirs = { File root, String suffix ->
        root.isDirectory()
                ? root.listFiles({ File f -> f.isDirectory() } as FileFilter)
                .sort { it.name }.reverse().collect { new File(it, suffix) }
                : []
    }
    dirs += versionDirs(new File(home, '.nvm/versions/node'), 'bin')
    dirs += versionDirs(new File(home, '.local/share/fnm/node-versions'), 'installation/bin')
    dirs += versionDirs(new File(home, 'AppData/Roaming/nvm'), '')
    dirs += [
            new File(home, '.volta/bin'),
            new File(home, '.asdf/shims'),
            new File('/usr/local/bin'),
            new File('/opt/homebrew/bin'),
            new File('/usr/bin'),
            new File('C:/Program Files/nodejs'),
    ]

    for (dir in dirs) {
        for (name in names) {
            def candidate = new File(dir, name)
            if (candidate.isFile()) {
                return candidate
            }
        }
    }
    return null
}

def npmBinary = findNpm()

def configureNpmTask = { Exec task, List<String> arguments ->
    task.workingDir = uiDir
    def npmPath = npmBinary?.absolutePath ?: 'npm'
    task.commandLine(isWindows ? ['cmd', '/c', npmPath] + arguments : [npmPath] + arguments)
    if (npmBinary != null) {
        // npm shells out to node, which lives next to it - keep that directory on the PATH.
        task.environment 'PATH', npmBinary.parentFile.absolutePath + File.pathSeparator + (System.getenv('PATH') ?: '')
    }
    task.doFirst {
        if (npmBinary == null) {
            throw new GradleException("""npm was not found.
  Install Node.js, or point the build at it explicitly:
    ./gradlew build -PnpmExecutable=/path/to/npm
  IDE builds: add npm's directory to the IDE's PATH, or set MEMORY_MCP_NPM.
  To build the server without the dashboard: ./gradlew build -PskipUi""")
        }
    }
}

tasks.register('npmInstall', Exec) {
    group = 'ui'
    description = 'Installs the dashboard dependencies'
    configureNpmTask(it, ['ci'])
    inputs.file(uiDir.file('package.json'))
    inputs.file(uiDir.file('package-lock.json'))
    outputs.file(uiDir.file('node_modules/.package-lock.json'))
}

tasks.register('buildUi', Exec) {
    group = 'ui'
    description = 'Builds the Vue dashboard into build/ui-dist'
    dependsOn 'npmInstall'
    configureNpmTask(it, ['run', 'build'])
    inputs.dir(uiDir.dir('src'))
    inputs.file(uiDir.file('index.html'))
    inputs.file(uiDir.file('vite.config.ts'))
    inputs.file(uiDir.file('package.json'))
    outputs.dir(uiDist)
}

tasks.named('processResources') {
    if (!skipUi) {
        dependsOn 'buildUi'
    }
    from(uiDist) {
        into 'static'
    }
}

tasks.named('clean') {
    delete uiDist
}
