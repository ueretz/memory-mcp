plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.iuribabalin'
version = '0.0.1-SNAPSHOT'
description = 'MCP server providing Postgres-backed long-term memory for Claude Code'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = 'memory-mcp.jar'
}

// ---- Vue dashboard (ui/) ----
// Vite writes to build/ui-dist; processResources packages it as /static inside the boot jar.
// Pass -PskipUi when the bundle was built elsewhere (see the ui stage in the Dockerfile).

def npmExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
def uiDir = layout.projectDirectory.dir('ui')
def uiDist = layout.buildDirectory.dir('ui-dist')
def skipUi = providers.gradleProperty('skipUi').present

tasks.register('npmInstall', Exec) {
    group = 'ui'
    description = 'Installs the dashboard dependencies'
    workingDir = uiDir
    commandLine npmExecutable, 'ci'
    inputs.file(uiDir.file('package.json'))
    inputs.file(uiDir.file('package-lock.json'))
    outputs.file(uiDir.file('node_modules/.package-lock.json'))
}

tasks.register('buildUi', Exec) {
    group = 'ui'
    description = 'Builds the Vue dashboard into build/ui-dist'
    dependsOn 'npmInstall'
    workingDir = uiDir
    commandLine npmExecutable, 'run', 'build'
    inputs.dir(uiDir.dir('src'))
    inputs.file(uiDir.file('index.html'))
    inputs.file(uiDir.file('vite.config.ts'))
    inputs.file(uiDir.file('package.json'))
    outputs.dir(uiDist)
}

tasks.named('processResources') {
    if (!skipUi) {
        dependsOn 'buildUi'
    }
    from(uiDist) {
        into 'static'
    }
}

tasks.named('clean') {
    delete uiDist
}
