plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.iuribabalin'
version = '0.0.1-SNAPSHOT'
description = 'MCP server providing Postgres-backed long-term memory for Claude Code'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // PDF export: commonmark renders markdown entries to HTML, Playwright prints that (or a
    // REPORT entry's own HTML) to PDF via headless Chromium.
    implementation 'org.commonmark:commonmark:0.30.0'
    implementation 'com.microsoft.playwright:playwright:1.62.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// One-time setup for PDF export: downloads the headless Chromium build Playwright drives.
// Re-run after bumping the playwright version above.
tasks.register('installPlaywrightBrowsers', JavaExec) {
    group = 'setup'
    description = 'Downloads the Chromium browser used for HTML/Markdown PDF export.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install', 'chromium']
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = 'memory-mcp.jar'
}

// ---- Vue dashboard (ui/) ----
// Vite writes to build/ui-dist; processResources packages it as /static inside the boot jar.
// Pass -PskipUi when the bundle was built elsewhere (see the ui stage in the Dockerfile).

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def uiDir = layout.projectDirectory.dir('ui')
def uiDist = layout.buildDirectory.dir('ui-dist')
def skipUi = providers.gradleProperty('skipUi').present

// Vite ships its bundler as platform-specific native binaries declared as optional dependencies
// guarded by this range. On an older Node npm skips them without failing, and the build dies much
// later with "Cannot find native binding" - so the version is checked up front. Keep in sync with
// the engines field in ui/package.json.
def requiredNode = '^20.19.0 || >=22.12.0'

def nodeVersionSupported = { String version ->
    if (!version) {
        return false
    }
    def match = version =~ /^v?(\d+)\.(\d+)\./
    if (!match) {
        return false
    }
    def major = match[0][1] as int
    def minor = match[0][2] as int
    return (major == 20 && minor >= 19) || (major == 22 && minor >= 12) || major >= 23
}

/** Version of the node sitting next to the given npm, or null when it cannot be determined. */
def nodeVersionOf = { File npmFile ->
    def sibling = new File(npmFile.parentFile, isWindows ? 'node.exe' : 'node')
    def command = sibling.isFile() ? sibling.absolutePath : (isWindows ? 'node.exe' : 'node')
    try {
        def process = new ProcessBuilder(command, '--version').redirectErrorStream(true).start()
        def output = process.inputStream.text.trim()
        return process.waitFor() == 0 && output.startsWith('v') ? output : null
    } catch (Exception ignored) {
        return null
    }
}

/**
 * Finds npm without relying on the PATH alone: Gradle daemons started by an IDE inherit the
 * desktop session's environment, which usually misses nvm/fnm/volta shims set up in the shell.
 * A candidate whose Node is too old is remembered but kept searching past - that way a usable
 * Node installed alongside an outdated default one still gets picked up.
 * Override with -PnpmExecutable=/path/to/npm if the search misses your install.
 */
def findNpm = {
    def names = isWindows ? ['npm.cmd', 'npm.exe'] : ['npm']

    def override = providers.gradleProperty('npmExecutable').orNull ?: System.getenv('MEMORY_MCP_NPM')
    if (override) {
        def file = new File(override)
        return [npm: file, node: nodeVersionOf(file)]
    }

    def home = new File(System.getProperty('user.home'))
    def dirs = []
    (System.getenv('PATH') ?: '').split(File.pathSeparator).findAll { it }.each { dirs << new File(it) }

    def versionDirs = { File root, String suffix ->
        root.isDirectory()
                ? root.listFiles({ File f -> f.isDirectory() } as FileFilter)
                .sort { it.name }.reverse().collect { new File(it, suffix) }
                : []
    }
    dirs += versionDirs(new File(home, '.nvm/versions/node'), 'bin')
    dirs += versionDirs(new File(home, '.local/share/fnm/node-versions'), 'installation/bin')
    dirs += versionDirs(new File(home, 'Library/Application Support/fnm/node-versions'), 'installation/bin')
    dirs += versionDirs(new File(home, 'AppData/Roaming/nvm'), '')
    dirs += [
            new File(home, '.volta/bin'),
            new File(home, '.asdf/shims'),
            new File('/usr/local/bin'),
            new File('/opt/homebrew/bin'),
            new File('/usr/bin'),
            new File('C:/Program Files/nodejs'),
    ]

    def fallback = null
    for (dir in dirs) {
        for (name in names) {
            def candidate = new File(dir, name)
            if (!candidate.isFile()) {
                continue
            }
            def version = nodeVersionOf(candidate)
            if (nodeVersionSupported(version)) {
                return [npm: candidate, node: version]
            }
            fallback = fallback ?: [npm: candidate, node: version]
        }
    }
    return fallback ?: [npm: null, node: null]
}

def npmInstallation = findNpm()
def npmBinary = npmInstallation.npm
def nodeVersion = npmInstallation.node

def configureNpmTask = { Exec task, List<String> arguments ->
    task.workingDir = uiDir
    def npmPath = npmBinary?.absolutePath ?: 'npm'
    task.commandLine(isWindows ? ['cmd', '/c', npmPath] + arguments : [npmPath] + arguments)
    if (npmBinary != null) {
        // npm shells out to node, which lives next to it - keep that directory on the PATH.
        task.environment 'PATH', npmBinary.parentFile.absolutePath + File.pathSeparator + (System.getenv('PATH') ?: '')
    }
    // A Node upgrade changes which native binaries npm installs, so it invalidates node_modules.
    task.inputs.property('nodeVersion', nodeVersion ?: 'unknown')
    task.doFirst {
        if (npmBinary == null) {
            throw new GradleException("""npm was not found.
  Install Node.js ${requiredNode}, or point the build at it explicitly:
    ./gradlew build -PnpmExecutable=/path/to/npm
  IDE builds: add npm's directory to the IDE's PATH, or set MEMORY_MCP_NPM.
  To build the server without the dashboard: ./gradlew build -PskipUi""")
        }
        if (!nodeVersionSupported(nodeVersion)) {
            throw new GradleException("""Node.js ${requiredNode} is required to build the dashboard, found ${nodeVersion ?: 'an unknown version'} (${npmBinary}).
  Older versions look like they work: npm skips Vite's platform-specific native binaries
  (they declare the same engines range) and the build then fails with "Cannot find native binding".
  Upgrade, for example:
    nvm install 22 && nvm use 22          # ui/.nvmrc pins 22
    brew upgrade node                     # or: brew install node@22
  Then let the build reinstall: rm -rf ui/node_modules && ./gradlew buildUi
  Another Node is already installed? Point the build at it: -PnpmExecutable=/path/to/npm
  To build the server without the dashboard: ./gradlew build -PskipUi""")
        }
    }
}

tasks.register('npmInstall', Exec) {
    group = 'ui'
    description = 'Installs the dashboard dependencies'
    configureNpmTask(it, ['ci'])
    inputs.file(uiDir.file('package.json'))
    inputs.file(uiDir.file('package-lock.json'))
    outputs.file(uiDir.file('node_modules/.package-lock.json'))
}

tasks.register('buildUi', Exec) {
    group = 'ui'
    description = 'Builds the Vue dashboard into build/ui-dist'
    dependsOn 'npmInstall'
    configureNpmTask(it, ['run', 'build'])
    inputs.dir(uiDir.dir('src'))
    inputs.file(uiDir.file('index.html'))
    inputs.file(uiDir.file('vite.config.ts'))
    inputs.file(uiDir.file('package.json'))
    outputs.dir(uiDist)
}

tasks.named('processResources') {
    if (!skipUi) {
        dependsOn 'buildUi'
    }
    from(uiDist) {
        into 'static'
    }
}

tasks.named('clean') {
    delete uiDist
}
