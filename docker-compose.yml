services:
  postgres:
    image: postgres:17-alpine
    container_name: memory-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: memorymcp
      POSTGRES_USER: memorymcp
      POSTGRES_PASSWORD: memorymcp
    ports:
      - "5433:5432"
    volumes:
      - memory-mcp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorymcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: memory-mcp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/memorymcp
      SPRING_DATASOURCE_USERNAME: memorymcp
      SPRING_DATASOURCE_PASSWORD: memorymcp
    ports:
      - "8080:8080"

volumes:
  memory-mcp-pgdata:
